name: Cria do Tatame CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate JSON
        run: npm run check:json
      - name: Validate game data
        run: npm run check:data
      - name: Generate asset manifest
        run: npm run assets:manifest
